services:
  api:
    build: .
    environment:
      DATABASE_PATH: /data/my-feed.db
      HTTP_ADDR: :8080
      # Shared Bearer for /api/v1 and /mcp. Empty disables auth.
      MY_FEED_API_KEY: ${MY_FEED_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
